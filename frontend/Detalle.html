<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Special+Elite&display=swap">
    <link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/Detalle.css"><title>Videoclub Nocturno — Detalle</title>
</head>
<body>
    <div class="app crt-on"><svg class="noise-filter" aria-hidden="true"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter></svg><div class="grain"></div>
        <header class="site-header">
            <a class="logo" href="/" aria-label="Ir al inicio"><span>VIDEOCLUB</span><strong>NOCTURNO</strong></a>
            <nav aria-label="Navegación principal">
                <a href="/">Inicio</a>
                <a href="/catalogo">Catálogo</a>
                <a href="/lista">Mi lista (<span id="list-count">0</span>)</a>
            </nav>
            <button class="crt-toggle on" onclick="toggleCRT(this)"><span class="toggle-light"></span> CRT ON</button>
        </header>
        <main class="detail-page">
            <a class="back-button" href="/catalogo">← VOLVER AL PASILLO</a>
            <div class="detail-layout" id="layout"></div>
        </main>
        <footer><div class="footer-logo">VN</div><p>POR FAVOR, SÉ AMABLE.<br><b>REBOBINA.</b></p><span>© 1989—2025<br>ABIERTO TODAS LAS NOCHES</span></footer>
    </div>
    <script src="js/data.js"></script>
    <script>
        const id=Number(new URLSearchParams(location.search).get("id"))||1;
        const m=movies.find(x=>x.id===id)||movies[0];
        const pad=(n,l)=>String(n).padStart(l,"0");
        const heart='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg>';
        document.title="Videoclub Nocturno — "+m.title;
        document.getElementById("layout").innerHTML=`
            <div class="detail-poster" style="background-image:url(${m.image});--accent:${m.color}">
                <span class="poster-rating">${m.rating}</span>
                <div><small>UNA PELÍCULA DE</small><h1>${m.title}</h1><p>${m.tagline}</p></div>
            </div>
            <div class="detail-content">
                <p class="eyebrow">Cinta Nº ${pad(m.id,3)} — Archivo nocturno</p>
                <h2>${m.title}</h2><p class="detail-tagline">“${m.tagline}”</p>
                <div class="meta"><span>${m.year}</span><span>${m.genre}</span><span>${m.runtime}</span></div>
                <h3>Sinopsis</h3>
                <p class="synopsis">${m.synopsis}</p>
                <h3>Reparto principal</h3>
                <div class="cast">${m.cast.map(p=>"<span>"+p+"</span>").join("")}</div>
                <button class="favorite-button" id="fav"></button>
            </div>
            <div class="ticket">
                <div class="ticket-top"><span>VIDEOCLUB NOCTURNO</span><b>ADMIT ONE</b></div>
                <div class="ticket-main"><small>SESIÓN ESPECIAL</small><h3>${m.title}</h3>
                    <div><p>FECHA<br><b>HOY</b></p><p>HORA<br><b>23:45</b></p><p>SALA<br><b>03</b></p></div>
                </div>
                <div class="barcode">||| || |||| | ||| || ||||</div>
                <small class="ticket-id">VN-${m.year}-${pad(m.id,4)}</small>
            </div>`;
        const fav=document.getElementById("fav");
        function paintFav(){
            const s=getFavs().includes(m.id);fav.className="favorite-button"+(s?" saved":"");
            fav.innerHTML=heart+(s?"Guardada en mi lista":"Guardar en mi lista");updateListCount();
        }
        fav.onclick=()=>{toggleFav(m.id);paintFav()};
        paintFav();
    </script> 
</body>
</html>
